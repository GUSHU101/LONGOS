name: LONGOS CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: longos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    # Keep production validation reproducible. GitHub periodically retargets
    # ubuntu-latest (including the Ubuntu 26 migration), which can otherwise
    # change Docker, OpenSSL and PHP behavior without a repository commit.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/database/database.sqlite
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify release-owned plugin sources
        shell: bash
        run: |
          set -euo pipefail
          plugins=(
            FlatShipping
            LongosLiveChat
            LongosProductReviews
            Paypal
            PixelTracking
            ShopifyProductTransfer
            Stripe
          )
          for plugin in "${plugins[@]}"; do
            test -f "plugins/${plugin}/Bootstrap.php" || {
              echo "Missing release-owned plugin source: ${plugin}" >&2
              exit 1
            }
          done
          test -f plugins/LongosChristmasTheme/config.json || {
            echo "Missing release-owned theme source: LongosChristmasTheme" >&2
            exit 1
          }
          test -f plugins/BeikeShopTestSandbox/Bootstrap.php || {
            echo "Missing test sandbox source required by the regression suite" >&2
            exit 1
          }

      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.2'
          extensions: curl, fileinfo, gd, iconv, mbstring, mysql, openssl, pdo, simplexml, zip
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Validate and install locked PHP dependencies
        run: |
          composer validate --strict --no-check-publish
          composer audit --locked --no-dev
          composer install --prefer-dist --no-interaction --no-progress

      - name: Enforce PHP formatting
        run: composer pint:test

      - name: Prepare isolated test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          touch database/database.sqlite

      - name: Run regression suite, build, and dependency audit
        run: |
          npm ci --ignore-scripts
          npm run check

  deployment-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOMAIN: admin.example.test
      SAAS_BASE_DOMAIN: shops.example.test
      ADMIN_EMAIL: ops@example.test
      COOLIFY_RESOURCE_UUID: ci
      SERVICE_REALBASE64_32_APPKEY: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      SERVICE_PASSWORD_64_DBROOT: ci-root-password
      SERVICE_USER_DBUSER: longos
      SERVICE_PASSWORD_64_DBPASSWORD: ci-database-password
      SERVICE_PASSWORD_64_ADMIN: ci-administrator-password
      SERVICE_PASSWORD_64_PROXYTOKEN: ci-proxy-token-ci-proxy-token-ci-proxy-token
      SERVICE_HEX_32_EDGEID: 0123456789abcdef0123456789abcdef
      SERVICE_PASSWORD_64_MAILRELAY: ci-mail-relay-secret-ci-mail-relay-secret
      SERVICE_PASSWORD_64_CLOUDMAIL: ci-cloud-mail-secret-ci-cloud-mail-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Coolify Raw Compose
        run: |
          docker compose config --quiet
          docker compose config --format json > /tmp/longos-compose.json
          jq -e '.services.app.environment.ADMIN_EMAIL == "ops@example.test"' /tmp/longos-compose.json
          jq -e '.services.app.environment.MAIL_FROM_ADDRESS == "no-reply@shops.example.test"' /tmp/longos-compose.json
          jq -e '.services.app.environment.MAIL_RELAY_PLATFORM_SENDER_DOMAIN == "shops.example.test"' /tmp/longos-compose.json
          jq -e '.services.app.environment.MAIL_RELAY_DNS_RECORDS_PATH == "/var/lib/longos-mail-dns"' /tmp/longos-compose.json
          jq -e '.services.app.volumes[] | select(.target == "/var/lib/longos-mail-dns" and .read_only == true)' /tmp/longos-compose.json
          jq -e '.services["mail-relay"].volumes[] | select(.target == "/var/lib/mail-relay-dns" and .read_only != true)' /tmp/longos-compose.json
          jq -e '[.services.app.volumes[] | select(.target == "/var/lib/dkim")] | length == 0' /tmp/longos-compose.json
          # Coolify removes its temporary Git artifact before Raw Compose
          # startup. Nested build contexts can otherwise be re-evaluated from
          # /data/coolify/applications/<uuid> and fail after old containers
          # were already stopped. Every repository build must use root.
          docker compose config --no-path-resolution --format json > /tmp/longos-compose-paths.json
          jq -e '[.services[] | select(.build != null) | .build.context] | length > 0 and all(. == ".")' \
            /tmp/longos-compose-paths.json
          jq -e '.services["mail-relay"].build.dockerfile == "docker/mail-relay/Dockerfile"' \
            /tmp/longos-compose-paths.json
          jq -e '.services.app.depends_on.mysql.condition == "service_healthy"' /tmp/longos-compose.json
          jq -e '.services.app.depends_on["mail-relay"] == null' /tmp/longos-compose.json

      - name: Validate Coolify build-only email fallback
        run: |
          ADMIN_EMAIL= docker compose config --format json > /tmp/longos-compose-fallback.json
          jq -e '.services.app.environment.ADMIN_EMAIL == "admin@admin.example.test"' /tmp/longos-compose-fallback.json
          jq -e '.services.app.environment.SAAS_TLS_EMAIL == "admin@admin.example.test"' /tmp/longos-compose-fallback.json
          jq -e '.services.app.labels["caddy.email"] == "admin@admin.example.test"' /tmp/longos-compose-fallback.json

      - name: Validate dedicated platform sender defaults
        run: |
          MAIL_FROM_ADDRESS= \
          MAIL_RELAY_PLATFORM_SENDER_DOMAIN=mail.brand.example \
            docker compose config --format json > /tmp/longos-compose-mail-domain.json
          jq -e '.services.app.environment.MAIL_FROM_ADDRESS == "no-reply@mail.brand.example"' \
            /tmp/longos-compose-mail-domain.json
          jq -e '.services.app.environment.MAIL_RELAY_PLATFORM_SENDER_DOMAIN == "mail.brand.example"' \
            /tmp/longos-compose-mail-domain.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Test the bundled mail relay
        working-directory: docker/mail-relay
        run: |
          npm ci
          npm audit --omit=dev
          npm test

  container-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DOMAIN: admin.example.test
      SAAS_BASE_DOMAIN: shops.example.test
      # Startup preflight deliberately rejects reserved/non-deliverable ACME
      # contact suffixes such as .test. Use a syntactically public CI address;
      # the smoke test never contacts an ACME authority.
      ADMIN_EMAIL: ops@ci.longos.dev
      COOLIFY_RESOURCE_UUID: ci-smoke
      SERVICE_REALBASE64_32_APPKEY: YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      SERVICE_PASSWORD_64_DBROOT: ci-root-password
      SERVICE_USER_DBUSER: longos
      SERVICE_PASSWORD_64_DBPASSWORD: ci-database-password
      SERVICE_PASSWORD_64_ADMIN: ci-administrator-password
      SERVICE_PASSWORD_64_PROXYTOKEN: ci-proxy-token-ci-proxy-token-ci-proxy-token
      SERVICE_HEX_32_EDGEID: 0123456789abcdef0123456789abcdef
      SERVICE_PASSWORD_64_MAILRELAY: ci-mail-relay-secret-ci-mail-relay-secret
      SERVICE_PASSWORD_64_CLOUDMAIL: ci-cloud-mail-secret-ci-cloud-mail-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build, install, and restart the production stack
        shell: bash
        run: |
          set -Eeuo pipefail

          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker compose ps --all || true
              docker compose logs --no-color --tail=300 || true
              # PHP-FPM writes application exceptions to the persistent
              # Laravel log rather than container stderr. Preserve that
              # evidence whenever a production-page probe fails so a green
              # health endpoint can never hide the actual storefront error.
              docker compose exec -T app sh -c \
                'for log in storage/logs/*.log; do [ -f "$log" ] && { echo "===== $log ====="; tail -n 500 "$log"; }; done' \
                || true
              docker logs longos-caddy-contract 2>/dev/null || true
            fi
            docker rm -f longos-caddy-contract >/dev/null 2>&1 || true
            docker compose down --volumes --remove-orphans || true
            docker network rm coolify >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT

          docker network inspect coolify >/dev/null 2>&1 || docker network create coolify
          docker compose build --pull app mail-relay
          docker compose up -d mysql mail-relay app

          wait_for_app() {
            for attempt in $(seq 1 180); do
              container_id="$(docker compose ps -q app)"
              if [ -z "$container_id" ] || [ "$(docker inspect --format '{{.State.Running}}' "$container_id")" != "true" ]; then
                echo "LONGOS app container exited during startup." >&2
                return 1
              fi
              restart_count="$(docker inspect --format '{{.RestartCount}}' "$container_id")"
              if [ "$restart_count" -gt 0 ]; then
                echo "LONGOS app restarted ${restart_count} time(s) during startup." >&2
                docker compose logs --no-color --tail=200 app >&2 || true
                return 1
              fi
              if docker compose exec -T app curl -fsS -o /dev/null \
                -H "Host: ${DOMAIN}" http://127.0.0.1/api/health; then
                return 0
              fi
              sleep 5
            done
            echo "LONGOS app did not become ready within 15 minutes." >&2
            return 1
          }

          wait_for_healthy() {
            service="$1"
            attempts="$2"
            for attempt in $(seq 1 "$attempts"); do
              container_id="$(docker compose ps -q "$service")"
              if [ -z "$container_id" ] || [ "$(docker inspect --format '{{.State.Running}}' "$container_id")" != "true" ]; then
                echo "LONGOS ${service} container exited while waiting for health." >&2
                return 1
              fi
              if [ "$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "$container_id")" = "healthy" ]; then
                return 0
              fi
              sleep 5
            done
            echo "LONGOS ${service} did not become healthy in time." >&2
            return 1
          }

          wait_for_app
          docker compose exec -T app test -f storage/installed
          docker compose exec -T app test -f plugins/Paypal/Bootstrap.php
          docker compose exec -T app test -f plugins/ShopifyProductTransfer/Bootstrap.php
          docker compose exec -T app test ! -e plugins/BeikeShopTestSandbox

          # /api/health deliberately bypasses session and page rendering. A
          # deployment is usable only when both public entry points can start
          # their database-backed sessions and render complete HTML responses.
          docker compose exec -T app curl -fsS -o /dev/null \
            -H "Host: ${DOMAIN}" http://127.0.0.1/
          docker compose exec -T app curl -fsS -o /dev/null \
            -H "Host: ${DOMAIN}" http://127.0.0.1/admin/login

          # Provision a real prefixed tenant against MySQL, including every
          # installed bundled plugin. SQLite regression tests cannot enforce
          # MySQL's 64-character index/constraint identifier limit, which is
          # part of the production shared-database contract.
          tenant_host="ci-tenant.${SAAS_BASE_DOMAIN}"
          tenant_definition='{"code":"ci-tenant","name":"CI Tenant","admin_email":"tenant@ci.longos.dev","admin_password":"ci-tenant-password-123"}'
          docker compose exec -T app php artisan saas:sites:create \
            --site="$tenant_definition"
          docker compose exec -T app php artisan saas:health \
            --site=ci-tenant --active-only --no-dns
          docker compose exec -T app curl -fsS -o /dev/null \
            -H "Host: ${tenant_host}" http://127.0.0.1/
          docker compose exec -T app curl -fsS -o /dev/null \
            -H "Host: ${tenant_host}" http://127.0.0.1/admin/login
          tenant_live_chat_tables="$(docker compose exec -T \
            -e MYSQL_PWD="${SERVICE_PASSWORD_64_DBPASSWORD}" mysql \
            mysql -u"${SERVICE_USER_DBUSER}" -D "${DB_DATABASE:-longos}" -Nse \
            "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE() AND table_name REGEXP '^lt_[0-9a-f]{12}_longos_live_chat_conversations$'")"
          test "$tenant_live_chat_tables" = "1"

          # Caddy does not call the ask endpoint through localhost. It resolves
          # the stable resource alias on Coolify's shared network, with that
          # alias as the HTTP Host. Exercise this exact path so a Compose
          # network or alias regression cannot pass an internal-only test.
          app_image="$(docker inspect --format '{{.Config.Image}}' "$(docker compose ps -q app)")"
          tls_ask_url="http://longos-${COOLIFY_RESOURCE_UUID}/_longos/tls/authorize"
          tls_network_status="$(docker run --rm --network coolify --entrypoint curl "$app_image" \
            --connect-timeout 5 --max-time 10 -sS -o /dev/null -w '%{http_code}' \
            --get --data-urlencode "domain=${DOMAIN}" "$tls_ask_url")"
          case "$tls_network_status" in
            2??) ;;
            *) echo "Coolify-network TLS ask failed through ${tls_ask_url}: HTTP ${tls_network_status}" >&2; exit 1 ;;
          esac
          tls_network_unknown_status="$(docker run --rm --network coolify --entrypoint curl "$app_image" \
            --connect-timeout 5 --max-time 10 -sS -o /dev/null -w '%{http_code}' \
            --get --data-urlencode 'domain=unregistered.example.test' "$tls_ask_url")"
          if [ "$tls_network_unknown_status" != "404" ]; then
            echo "Coolify-network TLS ask did not fail closed: HTTP ${tls_network_unknown_status}" >&2
            exit 1
          fi

          # Let the same label adapter used by Coolify parse and load the
          # project labels. Checking Caddy's active JSON catches unsupported
          # directives and malformed nesting that plain Compose validation
          # cannot see, without contacting a public ACME authority.
          docker run -d --name longos-caddy-contract \
            --network coolify \
            -e CADDY_INGRESS_NETWORKS=coolify \
            -e CADDY_DOCKER_POLLING_INTERVAL=1s \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            lucaslorentz/caddy-docker-proxy:2.13-alpine >/dev/null
          caddy_config_ready=false
          for attempt in $(seq 1 60); do
            if docker exec longos-caddy-contract wget -qO- http://127.0.0.1:2019/config/ \
              > /tmp/longos-caddy-active.json 2>/dev/null \
              && jq -e --arg ask "$tls_ask_url" \
                '.. | strings | select(. == $ask)' /tmp/longos-caddy-active.json >/dev/null \
              && jq -e '.. | objects | select(.handler? == "reverse_proxy")' \
                /tmp/longos-caddy-active.json >/dev/null; then
              caddy_config_ready=true
              break
            fi
            sleep 2
          done
          if [ "$caddy_config_ready" != "true" ]; then
            echo "Coolify Caddy did not load LONGOS on-demand TLS and reverse-proxy labels." >&2
            cat /tmp/longos-caddy-active.json >&2 2>/dev/null || true
            docker logs longos-caddy-contract >&2 || true
            exit 1
          fi

          # Exercise the exact fail-closed authorization decision used by
          # Coolify Caddy before it issues an On-Demand TLS certificate.
          tls_authorized_status="$(docker compose exec -T app curl -sS -o /dev/null -w '%{http_code}' \
            --get --data-urlencode "domain=${DOMAIN}" \
            -H "Host: ${DOMAIN}" http://127.0.0.1/_longos/tls/authorize)"
          case "$tls_authorized_status" in
            2??) ;;
            *) echo "Registered control domain was denied by the TLS ask endpoint: HTTP ${tls_authorized_status}" >&2; exit 1 ;;
          esac
          tls_unknown_status="$(docker compose exec -T app curl -sS -o /dev/null -w '%{http_code}' \
            --get --data-urlencode 'domain=unregistered.example.test' \
            -H "Host: ${DOMAIN}" http://127.0.0.1/_longos/tls/authorize)"
          if [ "$tls_unknown_status" != "404" ]; then
            echo "Unregistered domain did not fail closed at the TLS ask endpoint: HTTP ${tls_unknown_status}" >&2
            docker compose exec -T app curl -sS -i \
              --get --data-urlencode 'domain=unregistered.example.test' \
              -H "Host: ${DOMAIN}" http://127.0.0.1/_longos/tls/authorize >&2 || true
            docker compose exec -T app php artisan route:list --path=_longos -v >&2 || true
            exit 1
          fi

          wait_for_healthy mail-relay 60
          docker compose exec -T mail-relay node -e \
            "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
          # The HTTP/HMAC parser handles untrusted message metadata and must
          # not run as root or be able to read the DKIM private-key volume.
          docker compose exec -T mail-relay sh -c '
            pid="$(pgrep -f "^node /app/src/server.mjs$" | head -n 1)"
            test -n "$pid"
            test "$(awk "/^Uid:/ {print \$2}" "/proc/$pid/status")" -ne 0
          '

          # PHP may read the public TXT value used for optional Cloudflare
          # synchronization, but must never receive the DKIM private key.
          relay_public_dkim="/var/lib/mail-relay-dns/${SAAS_BASE_DOMAIN}/mail2026.txt"
          app_public_dkim="/var/lib/longos-mail-dns/${SAAS_BASE_DOMAIN}/mail2026.txt"
          docker compose exec -T mail-relay test -s "$relay_public_dkim"
          docker compose exec -T app test -s "$app_public_dkim"
          docker compose exec -T app grep -Eq '^v=DKIM1;.*p=' "$app_public_dkim"
          docker compose exec -T app test ! -e "/var/lib/dkim/${SAAS_BASE_DOMAIN}/mail2026.private"

          # The relay must reuse the persisted private key after a container
          # restart. Regenerating it would silently invalidate published DKIM.
          dkim_path="/var/lib/dkim/${SAAS_BASE_DOMAIN}/mail2026.private"
          docker compose exec -T --user node mail-relay test ! -r "$dkim_path"
          dkim_before="$(docker compose exec -T mail-relay sha256sum "$dkim_path" | awk '{print $1}')"
          test -n "$dkim_before"
          docker compose restart mail-relay
          wait_for_healthy mail-relay 60
          dkim_after="$(docker compose exec -T mail-relay sha256sum "$dkim_path" | awk '{print $1}')"
          test "$dkim_after" = "$dkim_before"

          # Outbound mail is an auxiliary service. A broken or deliberately
          # stopped relay must never prevent the storefront from completing a
          # cold application start, upgrade, preflight, or health transition.
          docker compose stop app mail-relay
          docker compose up -d app
          relay_container_id="$(docker compose ps -aq mail-relay)"
          test -n "$relay_container_id"
          test "$(docker inspect --format '{{.State.Running}}' "$relay_container_id")" = "false"
          wait_for_app
          docker compose exec -T app curl -fsS -o /dev/null \
            -H "Host: ${DOMAIN}" http://127.0.0.1/
          docker compose up -d mail-relay
          wait_for_healthy mail-relay 60

          docker compose up -d worker scheduler
          wait_for_healthy worker 60
          wait_for_healthy scheduler 60
          docker compose exec -T scheduler test -s storage/framework/scheduler-heartbeat

          # A second web start exercises the persisted-volume sync and the
          # automatic saas:upgrade path used by every later Coolify deploy.
          docker compose restart app
          wait_for_app
          docker compose exec -T app test -f storage/installed
          docker compose exec -T app curl -fsS -o /dev/null \
            -H "Host: ${DOMAIN}" http://127.0.0.1/
          docker compose exec -T app curl -fsS -o /dev/null \
            -H "Host: ${DOMAIN}" http://127.0.0.1/admin/login
          test "$(docker inspect --format '{{.State.Running}}' "$(docker compose ps -q worker)")" = "true"
          test "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q scheduler)")" = "healthy"
