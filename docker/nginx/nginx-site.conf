server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    # Logging
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    # Client max upload size
    client_max_body_size 100M;

    # Main location block
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Laravel has exactly one executable public PHP entry point. Uploaded or
    # plugin-published PHP files must never become web-executable.
    location = /index.php {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ \.php(?:/|$) {
        return 404;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }

    # Fingerprinted build assets are immutable.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ImageService derivatives include the source mtime and size in their
    # filename. A replaced tenant image therefore receives a new URL, making
    # generated responsive images safe to cache immutably at both proxy and
    # browser layers.
    location ^~ /cache/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Upload and catalog writers always allocate a unique filename. Keep these
    # heavy storefront assets in browser/CDN caches; edits receive a new URL.
    location ~* ^/(?:upload|image/catalog)/.*\.(?:jpg|jpeg|png|gif|webp|avif|ico|svg|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Plugins can publish stable filenames across upgrades, so use a long but
    # revalidatable lifetime rather than marking those files immutable.
    location ~* ^/plugin/.*\.(?:jpg|jpeg|png|gif|webp|avif|ico|css|js|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Bundled fonts never change in place and are shared by every storefront.
    location ^~ /fonts/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:jpg|jpeg|png|gif|webp|avif|ico|css|js|svg|woff2?|ttf|eot)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
}
