; Production errors belong in container logs, never in an HTTP response.
; A warning emitted before Laravel sends its status can otherwise turn a
; fail-closed 404/503 into a misleading 200 response at the Caddy edge.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL
expose_php = Off

; Variant-rich product editors generate substantially more than PHP's
; default 1,000 fields. Silent truncation can otherwise look like a failed
; Save or persist only part of a SKU matrix.
max_input_vars = 20000
post_max_size = 64M
upload_max_filesize = 32M
max_execution_time = 120
